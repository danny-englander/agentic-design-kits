# Netlify's build for swissminimal.ch. The project's base directory, set in Netlify, is this
# folder (demo); publish is relative to it. These override the project's settings in Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  # Two sites build from this repository. Skip this one when a push changed nothing outside
  # verdigris/, the other kit and its demo. A command that exits 0 skips the build.
  # With no earlier build to compare against (a newly linked project, or a deploy with the cache
  # cleared), Netlify gives the same commit twice; the first test makes that build rather than skip.
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(top)' ':(top,exclude)verdigris'"
